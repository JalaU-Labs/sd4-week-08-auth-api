services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sd4-week-08-auth-api:local
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_VERSION: "0.1.6"
      LOG_LEVEL: INFO
      SESSION_TTL_SECONDS: "3600"
      CASDOOR_ADMIN_PASSWORD: ${CASDOOR_ADMIN_PASSWORD:-}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-}
      CASDOOR_ISSUER: ${CASDOOR_ISSUER:-}
      CASDOOR_INTERNAL_ISSUER: ${CASDOOR_INTERNAL_ISSUER:-http://127.0.0.1:8000/casdoor}
      CASDOOR_REDIRECT_URI: ${CASDOOR_REDIRECT_URI:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
