services:
  api:
    build:
      target: builder
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - sd4_week_08_auth_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
    volumes:
      - ./src:/app/src
    environment:
      APP_ENV: development
    ports: !override
      - "8080:8080"
    healthcheck:
      disable: true
