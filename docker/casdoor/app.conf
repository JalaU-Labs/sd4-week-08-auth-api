# Secrets must be supplied through environment variables at runtime.
# Casdoor reads initAdminPassword from the environment before creating admin.
initAdminPassword = __CASDOOR_ADMIN_PASSWORD__

appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true
driverName = sqlite
dataSourceName = /app/casdoor/data/casdoor.db
dbName = casdoor
tableNamePrefix =
showSql = false
logConfig = {"adapter": "console"}
initDataFile = /app/casdoor/conf/init_data.json
frontendBaseDir = /app/web/build
basePath = /casdoor
