# Secrets must be supplied through environment variables at runtime.
# Casdoor v1.813.0 does not consume initAdminPassword; the empty value is a
# placeholder for a Casdoor release that supports that runtime setting.
initAdminPassword =

appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true
driverName = sqlite
dataSourceName = /app/casdoor/data/casdoor.db
dbName = casdoor
tableNamePrefix =
showSql = false
logConfig = {"adapter": "console"}
initDataFile =
frontendBaseDir =
